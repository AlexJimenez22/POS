
<div class="form-container" >
    <form #formData="ngForm" class="form" (ngSubmit)="handleLogin()">
        <div class="header">
            <p class="welcome-message" >Bienvenido a </p>
            <app-text-logo [text]="'POS'" /> 
            <p>Para iniciar sesion por favor ingresa tu correo y tu contraseña</p>
        </div>
        <div class="fields-container">
            <div class="field">
                <label for="userNumber">Numero de usuario</label>
                <input 
                  type="number" 
                  pInputText
                  name="userNumber"
                  [(ngModel)]="credentials.userNumber"
                  #userNumber="ngModel"
                  placeholder="Numero de usuario"
                  style="padding: 1rem;font-size: 1.5rem;"
                  required
                />
              @if( userNumber.invalid && userNumber.touched ){  
                <p class="p-error" >EL numero de empleado es invalido</p>
              }
            </div>
            <div class="field">
                <label for="password">Contraseña</label>
                <p-password 
                  [feedback]="false" 
                  [toggleMask]="true" 
                  autocomplete="off" 
                  name="password"
                  [(ngModel)]="credentials.password"
                  placeholder="Contraseña"
                  #password="ngModel"
                  required
                />
            </div>

            @if( password.invalid && password.touched ){
              <p class="p-error" >La contraseña es invalida</p>
            }
        </div>

        <div class="button-container" >
            <p-button 
              type="ngSubmit"
              label="Inciar Sesion" 
              styleClass="btn-login"
            /> 
        </div>
    </form>
</div>
